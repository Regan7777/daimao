<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 深邃黑曜石与星云渐变底座 -->
    <linearGradient id="daimaoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181326" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- 边框金色微光 -->
    <linearGradient id="daimaoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.6)" />
      <stop offset="40%" stop-color="rgba(139, 92, 246, 0.4)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.1)" />
    </linearGradient>

    <!-- 呆毛天线专属流金渐变 -->
    <linearGradient id="ahogeGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 霓虹紫光渐变 -->
    <linearGradient id="neonViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- 探针光晕 -->
    <filter id="ahogeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 立体发光圆环 -->
    <radialGradient id="antennaSphere" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>
  </defs>·  

  <!-- 圆角矩形底座 -->
  <rect width="512" height="512" rx="112" fill="url(#daimaoBg)" />
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="url(#daimaoBorder)" stroke-width="3" fill="none" />

  <!-- 背景科技光斑网格 -->
  <circle cx="256" cy="256" r="160" stroke="rgba(245, 158, 11, 0.08)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="210" stroke="rgba(139, 92, 246, 0.06)" stroke-width="1.5" />

  <!-- 信号弧波（雷达发射感） -->
  <path d="M 310 170 A 90 90 0 0 1 350 290" stroke="url(#neonViolet)" stroke-width="7" stroke-linecap="round" opacity="0.85" filter="url(#ahogeGlow)" />
  <path d="M 345 135 A 140 140 0 0 1 405 325" stroke="url(#ahogeGold)" stroke-width="6" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 8" />
  <path d="M 380 100 A 190 190 0 0 1 460 360" stroke="url(#neonViolet)" stroke-width="5" stroke-linecap="round" opacity="0.35" />

  <!-- 核心：灵动极客「呆毛」（Ahoge）立体曲面 -->
  <g filter="url(#ahogeGlow)">
    <!-- 呆毛根部连接基座 -->
    <path d="M 170 370 C 185 320, 205 270, 220 220 C 235 170, 245 110, 295 85 C 335 65, 365 95, 340 135 C 320 170, 275 220, 255 280 C 235 340, 220 375, 205 390 Z" 
          fill="url(#ahogeGold)" />
    
    <!-- 呆毛高光刃面 -->
    <path d="M 180 360 C 195 315, 215 265, 230 215 C 245 165, 255 115, 295 95 C 315 85, 335 95, 330 115 C 315 145, 280 195, 260 255 C 242 310, 225 350, 210 370 Z" 
          fill="url(#ahogeGold)" opacity="0.7" />

    <!-- 极客芯片信号球（呆毛尖端发射源） -->
    <circle cx="318" cy="98" r="22" fill="url(#antennaSphere)" />
    <circle cx="318" cy="98" r="28" stroke="url(#neonViolet)" stroke-width="2.5" opacity="0.75" />
    <circle cx="318" cy="98" r="38" stroke="url(#ahogeGold)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5" />
  </g>

  <!-- 极客节点底座（科技圆点与连线） -->
  <g>
    <circle cx="160" cy="385" r="14" fill="#f59e0b" />
    <circle cx="160" cy="385" r="22" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2" />
    <circle cx="230" cy="405" r="9" fill="#8b5cf6" />
    <path d="M 174 388 L 221 403" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" stroke-dasharray="2 3" />
  </g>

  <!-- 底部微标 "DAIMAO" 极客字标 -->
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="8" text-anchor="middle" opacity="0.95">DAIMAO</text>
  <text x="256" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" letter-spacing="3" text-anchor="middle" opacity="0.8">呆毛探针 · 2026</text>
</svg>
